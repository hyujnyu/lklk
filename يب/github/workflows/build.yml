name: Build Storage Helper APK

# هذا الملف يبني الـ APK تلقائياً على سيرفرات GitHub
# ما تحتاج تثبت شي على جهازك - كل شي يصير بالسحابة

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # يخفيك تشغل البناء يدوياً من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer and cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build debug APK
        run: buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: '0'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storage-helper-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
